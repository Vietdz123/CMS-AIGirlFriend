# Chạy chính máy này làm server, public ra Internet bằng Tailscale Funnel (không cần VPS / tên miền).
# docker compose -f docker-compose.server.yml --env-file .env.server up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: admob_cms
    volumes:
      - pgdata_server:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admob -d admob_cms"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.server
    environment:
      DATABASE_URL: postgresql://admob:${POSTGRES_PASSWORD}@postgres:5432/admob_cms?schema=public
      FRONTEND_URL: ${PUBLIC_URL}
      GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/api/admob/oauth/callback
    # Chỉ mở cho chính máy này; Tailscale Funnel lo HTTPS và đưa traffic từ Internet vào.
    ports:
      - "127.0.0.1:3000:3000"
    # Key service account (GA4 retention), chỉ đọc. Thư mục secrets/ không nằm trong git.
    volumes:
      - ./secrets:/run/secrets/cms:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Sao lưu database mỗi ngày 02:30 (giờ VN) vào ./backups/daily, giữ 14 bản (scripts/db-backup.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: admob
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: admob_cms
      KEEP: "14"
    volumes:
      - ./scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_server:
